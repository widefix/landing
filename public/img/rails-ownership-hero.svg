<svg xmlns="http://www.w3.org/2000/svg" width="560" height="490" viewBox="0 0 560 490" fill="none">
  <title>Your Rails application, in good hands</title>
  <desc>A Rails application connected to four stages of technical ownership: take over, stabilize, maintain and improve.</desc>
  <defs>
    <linearGradient id="canvas" x1="70" y1="30" x2="480" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EAF1F9"/></linearGradient>
    <linearGradient id="ruby" x1="258" y1="177" x2="308" y2="229" gradientUnits="userSpaceOnUse"><stop stop-color="#FA766B"/><stop offset="1" stop-color="#C9372D"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#193B5E" flood-opacity=".08"/></filter>
  </defs>
  <rect x="14" y="14" width="532" height="462" rx="40" fill="url(#canvas)"/>
  <circle cx="280" cy="245" r="160" stroke="#DAE4EF" stroke-dasharray="4 9"/>
  <circle cx="280" cy="245" r="117" fill="#FFF" fill-opacity=".45"/>
  <g stroke="#A4B8CE" stroke-width="2" stroke-linecap="round">
    <path d="M147 126V167Q147 183 163 183H188"/>
    <path d="M413 126V167Q413 183 397 183H372"/>
    <path d="M147 362V323Q147 307 163 307H188"/>
    <path d="M413 362V323Q413 307 397 307H372"/>
  </g>
  <g fill="#FFF" stroke="#DCE4ED" filter="url(#shadow)">
    <rect x="40" y="58" width="214" height="88" rx="18"/>
    <rect x="306" y="58" width="214" height="88" rx="18"/>
    <rect x="40" y="344" width="214" height="88" rx="18"/>
    <rect x="306" y="344" width="214" height="88" rx="18"/>
    <rect x="177" y="159" width="206" height="166" rx="22"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g font-size="11" font-weight="700" letter-spacing="1.5" fill="#A82D25">
      <text x="63" y="85">01 / TAKE OVER</text><text x="329" y="85">02 / STABILIZE</text>
      <text x="63" y="371">03 / MAINTAIN</text><text x="329" y="371">04 / IMPROVE</text>
    </g>
    <g font-size="16" font-weight="600" fill="#1C2F42">
      <text x="63" y="112">Understand the system</text><text x="329" y="112">Restore reliability</text>
      <text x="63" y="398">Keep it running</text><text x="329" y="398">Build what comes next</text>
    </g>
    <g font-size="11" fill="#5F6675">
      <text x="63" y="131">Code · infrastructure · priorities</text><text x="329" y="131">Production · performance · resilience</text>
      <text x="63" y="417">Upgrades · security · monitoring</text><text x="329" y="417">Features · integrations · scale</text>
    </g>
    <text x="280" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1C2F42">Your Rails app</text>
    <text x="280" y="276" text-anchor="middle" font-size="12" fill="#5F6675">A team that owns the whole picture</text>
    <text x="288" y="304" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#246447">IN GOOD HANDS</text>
  </g>
  <path d="M256 191L266 179H294L304 191L280 222L256 191Z" fill="url(#ruby)"/>
  <path d="M256 191H304M266 179L272 191L280 222L288 191L294 179M272 191H288" stroke="#FFF" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="229" cy="300" r="4" fill="#338462"/>
  <g fill="#F04338"><circle cx="177" cy="183" r="4"/><circle cx="383" cy="183" r="4"/><circle cx="177" cy="307" r="4"/><circle cx="383" cy="307" r="4"/></g>
  <g stroke="#CCD9E7" stroke-width="2" stroke-linecap="round"><path d="M45 252H57M51 246V258"/><path d="M503 229H515M509 223V235"/></g>
</svg>
