<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">React Native Audio Mixer</title>
  <desc id="desc">Four audio tracks named bass, chords, melody and click, each with a waveform, a volume fader and a level meter, playing in sync on a phone.</desc>
  <rect width="960" height="540" fill="#f7f9fa"/>
  <rect x="56" y="64" width="400" height="412" rx="10" fill="#ffffff" stroke="#d7e4df" stroke-width="2"/>
  <text x="88" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#267858" font-weight="700" letter-spacing="1.5">OPEN-SOURCE REACT NATIVE LIBRARY</text>
  <text x="88" y="176" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#193b5e">React Native</text>
  <text x="88" y="224" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#193b5e">Audio Mixer</text>
  <text x="88" y="276" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526273">Multitrack audio in sync,</text>
  <text x="88" y="302" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526273">with volume, pan, mute and solo</text>
  <text x="88" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526273">for every track</text>
  <rect x="88" y="380" width="152" height="40" rx="4" fill="#193b5e"/>
  <text x="164" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">iOS · Android</text>
  <text x="260" y="406" font-family="Menlo, monospace" font-size="14" fill="#245c94">npm · MIT</text>

  <rect x="560" y="40" width="300" height="460" rx="38" fill="#193b5e"/>
  <rect x="574" y="54" width="272" height="432" rx="28" fill="#ffffff"/>
