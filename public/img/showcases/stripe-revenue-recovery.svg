<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Stripe integration repaired, recurring revenue recovered</title>
  <desc id="desc">Stripe webhook processing is repaired and application subscriptions are reconciled. Approximately 525 dollars in monthly recurring revenue is recovered, with ongoing payment monitoring.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#F9F5FF"/><stop offset="1" stop-color="#EDE3F6"/></linearGradient>
    <linearGradient id="recovery" x1="48" y1="406" x2="912" y2="582" gradientUnits="userSpaceOnUse"><stop stop-color="#392654"/><stop offset="1" stop-color="#553579"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#694B88" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#392654" flood-opacity=".07"/></filter>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#background)"/>
  <rect width="960" height="640" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="60" fill="#806495" font-size="14" font-weight="700" letter-spacing="2">WORSHIPONLINE / PAYMENT ENGINEERING</text>
    <text x="48" y="105" fill="#30213E" font-size="32" font-weight="700">Payments and subscriptions, back in sync</text>
    <text x="48" y="140" fill="#776584" font-size="20">Repair the integration. Reconcile the data. Monitor the flow.</text>

    <path d="M306 270H351M609 270H654" stroke="#AA8BC4" stroke-width="3" stroke-linecap="round"/>
    <path d="m339 261 12 9-12 9m303-18 12 9-12 9" stroke="#AA8BC4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="48" y="190" width="258" height="172" rx="18" fill="#FFF" stroke="#DED0EA"/>
      <rect x="351" y="190" width="258" height="172" rx="18" fill="#FFF" stroke="#DED0EA"/>
      <rect x="654" y="190" width="258" height="172" rx="18" fill="#FFF" stroke="#DED0EA"/>
    </g>
    <rect x="72" y="212" width="48" height="48" rx="13" fill="#635BFF"/>
    <path d="M84 229h24m-24 8h18m-18 8h12" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <text x="136" y="244" fill="#635BFF" font-size="26" font-weight="700">Stripe</text>
    <text x="72" y="298" fill="#30213E" font-size="23" font-weight="700">Payment events</text>
    <text x="72" y="330" fill="#776584" font-size="19">Subscription activity</text>

    <rect x="375" y="212" width="48" height="48" rx="13" fill="#F0E7F8"/>
    <path d="M386 229h25m-20 9h15m-10 9h5" stroke="#8C61AD" stroke-width="3" stroke-linecap="round"/>
    <text x="439" y="244" fill="#806495" font-size="18" font-weight="700">REPAIRED</text>
    <text x="375" y="298" fill="#30213E" font-size="23" font-weight="700">Webhook processing</text>
    <text x="375" y="330" fill="#776584" font-size="19">Consistency restored</text>

    <rect x="678" y="212" width="48" height="48" rx="13" fill="#E1F1E9"/>
    <path d="m690 236 7 7 16-16" stroke="#398068" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="742" y="244" fill="#398068" font-size="18" font-weight="700">RECONCILED</text>
    <text x="678" y="298" fill="#30213E" font-size="23" font-weight="700">App subscriptions</text>
    <text x="678" y="330" fill="#776584" font-size="19">Historical data corrected</text>

    <rect x="48" y="406" width="864" height="178" rx="20" fill="url(#recovery)"/>
    <text x="78" y="444" fill="#D9C4ED" font-size="15" font-weight="700" letter-spacing="1.5">RECOVERED RECURRING REVENUE</text>
    <text x="78" y="524" fill="#FFF" font-size="64" font-weight="700">+$525</text>
    <text x="324" y="522" fill="#E6D7F2" font-size="24">MRR</text>
    <text x="80" y="557" fill="#D9C4ED" font-size="18">Approximate monthly revenue recovered</text>
    <path d="M530 446v98" stroke="#A181B9" stroke-opacity=".5"/>
    <circle cx="568" cy="459" r="5" fill="#A7D7B9"/>
    <text x="585" y="466" fill="#E6D7F2" font-size="20" font-weight="700">Ongoing payment monitoring</text>
    <path d="M562 518h34l13-16 20 32 20-43 18 27h32l20-13 21 13h126" stroke="#C8ADE3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="616" fill="#806495" font-size="14">Existing application improved · Revenue protected</text>
    <text x="912" y="616" text-anchor="end" fill="#806495" font-size="14" font-weight="700">WIDEFIX</text>
  </g>
</svg>
