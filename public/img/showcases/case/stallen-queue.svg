<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Shopwired's stalled background job queue</title>
  <desc id="desc">Shopwired sends events through a Ruby application event dispatcher to DelayedJob. An overloaded queue blocks integrations with Xero, ClearBooks, QuickBooks, Kashflow, and Mailchimp. A flame and backlog loop mark the bottleneck.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#FAFCFA"/><stop offset="1" stop-color="#EDF4EF"/></linearGradient>
    <linearGradient id="flame" x1="774" y1="148" x2="774" y2="302" gradientUnits="userSpaceOnUse"><stop stop-color="#F5A255"/><stop offset="1" stop-color="#D95647"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#416F58" stroke-opacity=".045"/></pattern>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="m2 2 6 3-6 3" stroke="#5F9475" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="m2 2 6 3-6 3" stroke="#D56859" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183D32" flood-opacity=".055"/></filter>
  </defs>
  <rect width="1200" height="800" rx="24" fill="url(#background)"/>
  <rect width="1200" height="800" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="53" fill="#5D806B" font-size="14" font-weight="700" letter-spacing="2">SHOPWIRED / THE PRODUCTION BOTTLENECK</text>
    <text x="44" y="98" fill="#18382F" font-size="34" font-weight="700">One stalled queue. Multiple blocked integrations.</text>
    <text x="44" y="133" fill="#63796B" font-size="20">Events reach DelayedJob, but work stops moving downstream.</text>

    <g stroke="#5F9475" stroke-width="3" stroke-linecap="round" marker-end="url(#greenArrow)"><path d="M274 421H328"/><path d="M574 421H650"/></g>
    <text x="301" y="396" text-anchor="middle" fill="#63796B" font-size="13">events</text>
    <text x="612" y="396" text-anchor="middle" fill="#63796B" font-size="13">jobs</text>
    <g stroke="#D56859" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redArrow)">
      <path d="M904 390H940V230Q940 214 956 214H1001"/>
      <path d="M904 405H960V330Q960 314 976 314H1001"/>
      <path d="M904 421H1001"/>
      <path d="M904 437H960V506Q960 522 976 522H1001"/>
      <path d="M904 453H940V610Q940 626 956 626H1001"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="44" y="354" width="230" height="136" rx="18" fill="#FFF" stroke="#8CB69A" stroke-width="2"/>
      <rect x="338" y="354" width="236" height="136" rx="18" fill="#FFF" stroke="#8CB69A" stroke-width="2"/>
      <rect x="660" y="342" width="244" height="160" rx="20" fill="#FCE4DF" stroke="#D56859" stroke-width="2"/>
    </g>
    <text x="159" y="409" text-anchor="middle" fill="#285640" font-size="27" font-weight="700">Shopwired</text>
    <text x="159" y="444" text-anchor="middle" fill="#63796B" font-size="18">Commerce platform</text>
    <text x="456" y="403" text-anchor="middle" fill="#285640" font-size="26" font-weight="700">Ruby application</text>
    <text x="456" y="439" text-anchor="middle" fill="#63796B" font-size="19">Event dispatcher</text>
    <text x="782" y="397" text-anchor="middle" fill="#793C33" font-size="29" font-weight="700">DelayedJob</text>
    <text x="782" y="432" text-anchor="middle" fill="#A35649" font-size="19">Background job queue</text>
    <rect x="721" y="452" width="122" height="29" rx="14.5" fill="#D56859"/>
    <text x="782" y="472" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" letter-spacing="1">STALLED</text>

    <path d="M744 302C702 284 722 241 737 221C739 240 750 242 757 218C768 192 780 171 788 153C792 192 802 216 819 205C820 232 842 254 829 280C816 306 774 317 744 302Z" fill="url(#flame)"/>
    <path d="M755 260l12 5m22 0 12-5" stroke="#FFF4E7" stroke-width="4" stroke-linecap="round"/>
    <path d="M762 288q16-17 32 0" stroke="#FFF4E7" stroke-width="4" stroke-linecap="round"/>
    <path d="M782 317v13" stroke="#D56859" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 6"/>

    <text x="1081" y="164" text-anchor="middle" fill="#63796B" font-size="13" font-weight="700" letter-spacing="1">CONNECTED SERVICES</text>
    <g fill="#FFF" stroke="#8CB69A" stroke-width="2">
      <rect x="1012" y="178" width="150" height="72" rx="14"/>
      <rect x="1012" y="278" width="150" height="72" rx="14"/>
      <rect x="1012" y="385" width="150" height="72" rx="14"/>
      <rect x="1012" y="486" width="150" height="72" rx="14"/>
      <rect x="1012" y="590" width="150" height="72" rx="14"/>
    </g>
    <g text-anchor="middle" fill="#285640" font-size="20" font-weight="700">
      <text x="1087" y="221">Xero</text>
      <text x="1087" y="321">ClearBooks</text>
      <text x="1087" y="428">QuickBooks</text>
      <text x="1087" y="529">Kashflow</text>
      <text x="1087" y="633">Mailchimp</text>
    </g>

    <path d="M851 514C890 558 899 627 856 664C811 703 683 706 638 664C594 622 607 562 657 531L701 507" stroke="#D56859" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redArrow)"/>
    <text x="749" y="593" text-anchor="middle" fill="#A35649" font-size="14" font-weight="700" letter-spacing="1">QUEUE BACKLOG</text>
    <text x="749" y="637" text-anchor="middle" fill="#793C33" font-size="28" font-weight="700">100k+ stuck jobs</text>
    <text x="44" y="755" fill="#63796B" font-size="16">The problem before optimization: stalled processing and recurring Heroku H12 errors.</text>
    <text x="1160" y="755" text-anchor="end" fill="#5D806B" font-size="14" font-weight="700">WIDEFIX</text>
  </g>
</svg>
