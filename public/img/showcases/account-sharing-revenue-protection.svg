<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Account sharing reduced, subscription revenue protected</title>
  <desc id="desc">Account sharing is measured, targeted multi-factor authentication is enabled, and each account is limited to three simultaneous login sessions. The work prevented five percent monthly revenue losses.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#F5FAF6"/><stop offset="1" stop-color="#DFEEE3"/></linearGradient>
    <linearGradient id="recovery" x1="48" y1="406" x2="912" y2="582" gradientUnits="userSpaceOnUse"><stop stop-color="#183D32"/><stop offset="1" stop-color="#2C5A47"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#416F58" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183D32" flood-opacity=".07"/></filter>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#background)"/>
  <rect width="960" height="640" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="60" fill="#5D806B" font-size="14" font-weight="700" letter-spacing="2">WORSHIPONLINE / SUBSCRIPTION PROTECTION</text>
    <text x="48" y="105" fill="#18382F" font-size="32" font-weight="700">Less account sharing. Protected revenue</text>
    <text x="48" y="140" fill="#63796B" font-size="20">Measure sharing. Verify access. Limit simultaneous sessions.</text>

    <path d="M306 270H351M609 270H654" stroke="#8BB39A" stroke-width="3" stroke-linecap="round"/>
    <path d="m339 261 12 9-12 9m303-18 12 9-12 9" stroke="#8BB39A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="48" y="190" width="258" height="172" rx="18" fill="#FFF" stroke="#CFE0D3"/>
      <rect x="351" y="190" width="258" height="172" rx="18" fill="#FFF" stroke="#CFE0D3"/>
      <rect x="654" y="190" width="258" height="172" rx="18" fill="#FFF" stroke="#CFE0D3"/>
    </g>
    <rect x="72" y="212" width="48" height="48" rx="13" fill="#367C5B"/>
    <path d="M84 246v-9m12 9v-20m12 20v-14" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <text x="136" y="244" fill="#367C5B" font-size="18" font-weight="700">MEASURE</text>
    <text x="72" y="298" fill="#18382F" font-size="23" font-weight="700">Sharing patterns</text>
    <text x="72" y="330" fill="#63796B" font-size="19">Metabase monitoring</text>

    <rect x="375" y="212" width="48" height="48" rx="13" fill="#E6F1E8"/>
    <path d="m399 220 13 5v10c0 8-7 13-13 16-6-3-13-8-13-16v-10l13-5Z" stroke="#4B8863" stroke-width="2.5" stroke-linejoin="round"/><path d="m393 235 4 4 8-9" stroke="#4B8863" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="439" y="244" fill="#5D806B" font-size="18" font-weight="700">VERIFY</text>
    <text x="375" y="298" fill="#18382F" font-size="23" font-weight="700">Targeted MFA</text>
    <text x="375" y="330" fill="#63796B" font-size="19">Verify account access</text>

    <rect x="678" y="212" width="48" height="48" rx="13" fill="#E1F1E9"/>
    <rect x="688" y="223" width="12" height="21" rx="2" stroke="#398068" stroke-width="2"/><rect x="705" y="228" width="10" height="16" rx="2" stroke="#398068" stroke-width="2"/><path d="M685 250h33" stroke="#398068" stroke-width="2" stroke-linecap="round"/>
    <text x="742" y="244" fill="#398068" font-size="18" font-weight="700">LIMIT</text>
    <text x="678" y="298" fill="#18382F" font-size="23" font-weight="700">3 active sessions</text>
    <text x="678" y="330" fill="#63796B" font-size="19">Maximum per account</text>

    <rect x="48" y="406" width="864" height="178" rx="20" fill="url(#recovery)"/>
    <text x="78" y="444" fill="#BADBC4" font-size="15" font-weight="700" letter-spacing="1.5">MONTHLY REVENUE LOSSES PREVENTED</text>
    <text x="78" y="524" fill="#FFF" font-size="64" font-weight="700">5%</text>
    <text x="207" y="522" fill="#DFF0E4" font-size="24">monthly</text>
    <text x="80" y="557" fill="#BADBC4" font-size="18">Subscription revenue stopped declining</text>
    <path d="M530 446v98" stroke="#7CAA8C" stroke-opacity=".5"/>
    <circle cx="568" cy="459" r="5" fill="#A7D7B9"/>
    <text x="585" y="466" fill="#DFF0E4" font-size="20" font-weight="700">Revenue stabilized</text>
    <path d="M562 514h304" stroke="#B7DCC3" stroke-width="3" stroke-linecap="round"/><circle cx="866" cy="514" r="5" fill="#B7DCC3"/><text x="562" y="552" fill="#BADBC4" font-size="18">MFA + session limits + monitoring</text>
    <text x="48" y="616" fill="#5D806B" font-size="14">Existing application improved · Account sharing reduced</text>
    <text x="912" y="616" text-anchor="end" fill="#5D806B" font-size="14" font-weight="700">WIDEFIX</text>
  </g>
</svg>
