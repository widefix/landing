<svg xmlns="http://www.w3.org/2000/svg" width="687" height="377" viewBox="0 0 687 377" fill="none"><title>CostaDelHome CRM: multiple managers per property, zero downtime</title><rect width="687" height="377" rx="28" fill="#EEF6FF"/><g font-family="Arial, sans-serif"><text x="40" y="55" fill="#1C2F42" font-size="25" font-weight="700">CostaDelHome CRM</text><text x="40" y="85" fill="#5F6675" font-size="16">More flexible relationships. A continuous rollout.</text><rect x="40" y="120" width="250" height="110" rx="16" fill="white" stroke="#D2D9E9"/><rect x="397" y="120" width="250" height="110" rx="16" fill="#193B5E"/><text x="165" y="162" text-anchor="middle" fill="#1C2F42" font-size="21" font-weight="700">One manager</text><text x="165" y="195" text-anchor="middle" fill="#5F6675" font-size="15">Single selection per property</text><text x="522" y="162" text-anchor="middle" fill="white" font-size="21" font-weight="700">Multiple managers</text><text x="522" y="195" text-anchor="middle" fill="white" font-size="15">Multiple selections per property</text><text x="40" y="298" fill="#246447" font-size="36" font-weight="700">Zero downtime</text><text x="40" y="331" fill="#5F6675" font-size="16">Existing data preserved. No disruption to existing users.</text></g><path d="M311 175h65m-12-12 12 12-12 12" stroke="#276CB4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
