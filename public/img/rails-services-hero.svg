  <g font-family="Inter, Arial, sans-serif">
    <g fill="#1C2F42" font-size="16" font-weight="600">
      <text x="62" y="121">Maintenance &amp; support</text>
      <text x="332" y="121">Ruby &amp; Rails upgrades</text>
      <text x="43" y="263">Performance</text>
      <text x="387" y="263">Development</text>
      <text x="62" y="405">Infrastructure</text>
      <text x="332" y="405">Integrations</text>
    </g>
    <g fill="#5F6675" font-size="11">
      <text x="62" y="141">Fixes · monitoring · security</text>
      <text x="332" y="141">Versions · gems · compatibility</text>
      <text x="43" y="283">Queries · jobs · reliability</text>
      <text x="387" y="283">Features · web · mobile</text>
      <text x="62" y="425">Cloud · deployments · CI/CD</text>
      <text x="332" y="425">Payments · accounting · AI</text>
