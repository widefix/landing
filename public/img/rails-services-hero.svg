    <path d="M78 71L86 74V80C86 85 82 89 78 91C74 89 70 85 70 80V74L78 71Z"/><path d="M74 80L77 83L82 77"/>
    <!-- Upgrade arrow -->
    <path d="M348 90V73M342 79L348 73L354 79M340 90H356"/>
    <!-- Performance gauge -->
    <path d="M50 230A10 10 0 1 1 68 230M59 226L65 218M49 225H52M66 225H69"/><circle cx="59" cy="226" r="2"/>
    <!-- Code -->
    <path d="M398 218L393 223L398 228M408 218L413 223L408 228M405 214L401 232"/>
    <!-- Infrastructure -->
    <rect x="69" y="356" width="18" height="7" rx="2"/><rect x="69" y="367" width="18" height="7" rx="2"/><path d="M73 359.5H74M73 370.5H74M80 359.5H83M80 370.5H83"/>
    <!-- Connected systems -->
    <rect x="338" y="356" width="7" height="7" rx="2"/><rect x="351" y="367" width="7" height="7" rx="2"/><path d="M345 359.5H351Q354.5 359.5 354.5 363V367M338 370.5H343Q346.5 370.5 346.5 367V363"/>
