<svg xmlns="http://www.w3.org/2000/svg" width="560" height="490" viewBox="0 0 560 490" fill="none">
  <title>Services for your Rails application</title>
  <desc>Six connected service areas: maintenance and support, Ruby and Rails upgrades, performance, feature development, infrastructure, and integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="30" y1="20" x2="530" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EAF1F9"/></linearGradient>
    <linearGradient id="ruby" x1="256" y1="205" x2="304" y2="249" gradientUnits="userSpaceOnUse"><stop stop-color="#FA766B"/><stop offset="1" stop-color="#C9372D"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#193B5E" flood-opacity=".07"/></filter>
  </defs>
  <rect x="14" y="14" width="532" height="462" rx="40" fill="url(#bg)"/>
  <g stroke="#C5D5E6" stroke-width="2" stroke-linecap="round">
    <path d="M145 141L242 219M415 141L318 219M145 349L242 271M415 349L318 271M191 245H227M333 245H369"/>
  </g>
  <circle cx="280" cy="245" r="90" stroke="#D7E2EE" stroke-dasharray="3 8"/>
  <g fill="#FFF" stroke="#DCE4ED" filter="url(#shadow)">
    <rect x="44" y="49" width="202" height="108" rx="18"/>
    <rect x="314" y="49" width="202" height="108" rx="18"/>
    <rect x="25" y="191" width="166" height="108" rx="18"/>
    <rect x="369" y="191" width="166" height="108" rx="18"/>
    <rect x="44" y="333" width="202" height="108" rx="18"/>
    <rect x="314" y="333" width="202" height="108" rx="18"/>
    <circle cx="280" cy="245" r="57"/>
  </g>
  <g fill="#F0F5FB">
    <rect x="62" y="65" width="32" height="32" rx="10"/>
    <rect x="332" y="65" width="32" height="32" rx="10"/>
    <rect x="43" y="207" width="32" height="32" rx="10"/>
    <rect x="387" y="207" width="32" height="32" rx="10"/>
    <rect x="62" y="349" width="32" height="32" rx="10"/>
    <rect x="332" y="349" width="32" height="32" rx="10"/>
  </g>
  <g stroke="#276CB4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
