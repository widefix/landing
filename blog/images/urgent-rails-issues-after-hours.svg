<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A Rails production incident between dusk and dawn</title>
  <desc id="desc">A night-to-morning sky frames an incident dashboard. A stopped queue gives way to a flowing queue and a verified customer workflow.</desc>
  <defs>
    <linearGradient id="sky">
      <stop stop-color="#132e37"/>
      <stop offset=".48" stop-color="#31565a"/>
      <stop offset="1" stop-color="#ead0a0"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#f7f6e9"/>
      <stop offset="1" stop-color="#dce8dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dy="18" stdDeviation="16" flood-color="#122a2a" flood-opacity=".35"/>
    </filter>
  </defs>
  <path fill="url(#sky)" d="M0 0h1200v720H0z"/>
  <g fill="#e5e9d2">
    <path d="M153 66a41 41 0 1 0 48 55 44 44 0 0 1-48-55Z"/>
    <circle cx="109" cy="168" r="3"/>
    <circle cx="236" cy="88" r="4"/>
    <circle cx="298" cy="142" r="3"/>
    <circle cx="378" cy="93" r="2"/>
  </g>
  <circle cx="1015" cy="132" r="61" fill="#ffdfa4"/>
  <path d="M0 520q240-138 490-7t710-60v267H0Z" fill="#527975"/>
  <path d="M0 598q325-101 640 7t560-43v158H0Z" fill="#294e50"/>
  <g filter="url(#shadow)">
    <rect x="140" y="194" width="920" height="350" rx="25" fill="#183b3e"/>
    <path d="M140 257h920v262a25 25 0 0 1-25 25H165a25 25 0 0 1-25-25Z" fill="url(#panel)"/>
  </g>
  <g fill="#9db9a8">
    <circle cx="174" cy="226" r="5"/>
    <circle cx="194" cy="226" r="5"/>
    <circle cx="214" cy="226" r="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="bold">
    <text x="247" y="233" fill="#eef0de" font-size="19" letter-spacing="3">RAILS PRODUCTION</text>
    <g fill="#214642" font-size="21" text-anchor="middle">
      <text x="320" y="459">Queue stalled</text>
      <text x="600" y="459">Processing resumes</text>
      <text x="880" y="459">Workflow verified</text>
    </g>
  </g>
