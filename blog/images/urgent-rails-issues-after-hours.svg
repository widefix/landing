  <g fill="#e4b978" stroke="#8e6037" stroke-width="3">
    <rect x="253" y="351" width="34" height="34" rx="6"/>
    <rect x="303" y="351" width="34" height="34" rx="6"/>
    <rect x="353" y="351" width="34" height="34" rx="6"/>
    <path d="M395 341v54" fill="none" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M518 368h164" stroke="#94b6a3" stroke-width="4" stroke-linecap="round"/>
  <g fill="#529477" stroke="#285e50" stroke-width="3">
    <rect x="524" y="351" width="34" height="34" rx="6"/>
    <rect x="583" y="351" width="34" height="34" rx="6"/>
    <rect x="642" y="351" width="34" height="34" rx="6"/>
  </g>
  <circle cx="880" cy="368" r="38" fill="#529477" stroke="#285e50" stroke-width="3"/>
  <path d="m863 368 11 11 24-26" fill="none" stroke="#fff8e7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
