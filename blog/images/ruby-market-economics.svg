<title id="title">Weighing the future of Ruby work</title>
<desc id="desc">A brass balance holds a faceted ruby on one pan and an established application building on the other. An engineer tends the building, representing the relationship between developer capacity and the work needed to maintain existing Rails products. The balance is conceptual, not a measured economic chart.</desc>
