<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Start with one server</title>
  <desc id="description">A web browser and a mobile phone connect to one Rails application server. A dashed line connects that server to a separate database.</desc>
