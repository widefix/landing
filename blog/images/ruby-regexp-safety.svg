    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#ab845b"/><stop offset="1" stop-color="#5c493d"/></linearGradient>
    <linearGradient id="door" x2="1" y2="1"><stop stop-color="#769487"/><stop offset="1" stop-color="#345d56"/></linearGradient>
    <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#fae7ae"/><stop offset=".5" stop-color="#b88b4c"/><stop offset="1" stop-color="#f0d69c"/></linearGradient>
    <radialGradient id="glass"><stop stop-color="#b7d6cd" stop-opacity=".05"/><stop offset="1" stop-color="#b7d6cd" stop-opacity=".35"/></radialGradient>
