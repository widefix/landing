  <title id="title">Inspect the gate before reopening it</title>
  <desc id="description">A brass magnifying glass reveals a ruby-red lock on a workshop gate. Pattern cards rest on the workbench beside a green inspection seal, representing a review of untrusted patterns and verification of a patched runtime.</desc>
