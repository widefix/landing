<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Preparing the crossing before switching tracks</title>
  <desc id="description">A warm paper-textured railway landscape. A green train follows the established track while a release train waits beside a database-shaped signal tower. Three illuminated signals mark the image, environment, and migration checks before the tracks join at a switch.</desc>
  <defs>
    <linearGradient id="sky" x1="900" y1="0" x2="900" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#A2BEC6"/><stop offset=".55" stop-color="#EFE0BA"/><stop offset="1" stop-color="#E6BC7F"/></linearGradient>
    <linearGradient id="land" x1="900" y1="490" x2="900" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#9EA77C"/><stop offset="1" stop-color="#68785A"/></linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4C7E6D"/><stop offset="1" stop-color="#244E43"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DEAD70"/><stop offset="1" stop-color="#A86E45"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#FFF2C8"/><stop offset="1" stop-color="#FFE8AF" stop-opacity="0"/></radialGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".38" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2C443C" flood-opacity=".2"/></filter>
