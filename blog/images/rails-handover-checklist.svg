<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A Rails application handover from scattered accounts to shared ownership</title>
<desc id="desc">Account keys, source code and production systems connect to a central handover checklist, then to a shared application ownership folder</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#244653" stroke-opacity=".06"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#244653" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="720" rx="24" fill="#f2efe5"/><rect width="1200" height="720" fill="url(#grid)"/>
<g font-family="Arial,sans-serif" fill="#244653"><text x="72" y="90" font-size="20" letter-spacing="3">WHEN YOUR RAILS DEVELOPER LEAVES</text><text x="72" y="145" font-size="38" font-weight="700">Give the working product a clear next owner</text></g>
<g stroke="#719885" stroke-width="4" fill="none"><path d="M315 305h80v100h55M315 450h60v-45h75M750 405h100"/><circle cx="395" cy="405" r="7" fill="#719885"/></g>
<g filter="url(#shadow)"><rect x="72" y="230" width="245" height="135" rx="16" fill="#fffaf0"/><rect x="72" y="395" width="245" height="135" rx="16" fill="#fffaf0"/><rect x="450" y="220" width="300" height="370" rx="18" fill="#fffaf0"/><path d="M850 300v-40q0-15 15-15h85l24 30h130q20 0 20 20v220q0 20-20 20H870q-20 0-20-20z" fill="#d4e4d5" stroke="#244653" stroke-width="4"/></g>
<g stroke="#244653" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="118" cy="280" r="16"/><path d="M134 280h49m-15 0v15m-17-15v10M105 440l-15 15 15 15m30-30 15 15-15 15m-16-35-9 49"/><rect x="515" y="205" width="170" height="38" rx="9" fill="#e4ba69"/><path d="M900 380h170m-170 40h170m-170 40h110"/></g>
<g fill="#244653" font-family="Arial,sans-serif" font-size="21"><text x="95" y="335">Accounts &amp; access</text><text x="95" y="505">Code &amp; production</text><text x="490" y="292" font-size="24" font-weight="700">Handover record</text><text x="540" y="355">Access map</text><text x="540" y="415">Verified risks</text><text x="540" y="475">First milestone</text><text x="540" y="535">Support plan</text><text x="875" y="335" font-weight="700">Shared ownership</text><text x="72" y="660" font-size="20">Recover access · Agree priorities · Verify the next release</text></g>
