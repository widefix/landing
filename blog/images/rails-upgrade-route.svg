<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
  <title id="title">Survey the route before the climb</title>
  <desc id="description">A map and compass on a surveyor's table overlook a mountain valley. Three marked waypoints follow a winding route across the landscape, representing an upgrade planned in verifiable stages.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a7c2ca"/><stop offset="1" stop-color="#f4dfb4"/></linearGradient>
    <linearGradient id="land" x2="0" y2="1"><stop stop-color="#9dac85"/><stop offset="1" stop-color="#426e62"/></linearGradient>
    <linearGradient id="table" x2="0" y2="1"><stop stop-color="#a17c55"/><stop offset="1" stop-color="#674e3e"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff2c9"/><stop offset="1" stop-color="#ffedba" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".4" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#223f3b" flood-opacity=".3"/></filter>
  </defs>
