<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">Keep the signal, filter the noise</title>
<desc id="description">A monitoring desk in a quiet green landscape. A sieve catches a shower of rust-colored scan requests, while a single green signal travels to a clear incident panel. A small Ruby application sits beside the panel.</desc>
<defs>
  <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f5edda"/><stop offset="1" stop-color="#e5dcc4"/></linearGradient>
  <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#789784"/><stop offset="1" stop-color="#355f50"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <pattern id="mesh" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0h18v18" fill="none" stroke="#547664" stroke-width="2"/></pattern>
</defs>
<g filter="url(#grain)">
<path fill="url(#paper)" d="M0 0h1200v630H0z"/>
<circle cx="1040" cy="123" r="65" fill="#e3c68f" opacity=".65"/>
<path d="M0 490Q180 430 360 477T730 453T1200 419V630H0Z" fill="#b4c1a6"/>
<path d="M0 548Q200 469 400 525T800 490T1200 480V630H0Z" fill="url(#hill)"/>
<g fill="#244e40" font-family="Georgia,serif">
<text x="65" y="85" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">WIDEFIX / RAILS MAINTENANCE</text>
<text x="62" y="166" font-size="57">Keep the signal</text>
<text x="62" y="232" font-size="57">Filter the noise</text>
</g>
<path d="M67 264h60" stroke="#b46c51" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#456655" font-size="19"><text x="66" y="306">Less triage. More useful monitoring.</text><text x="66" y="338">Room for the failures that matter.</text></g>
<!-- Incoming scan requests -->
<g fill="#bc795e" stroke="#925a47" stroke-width="2">
<rect x="619" y="128" width="42" height="28" rx="5" transform="rotate(16 640 142)"/><rect x="696" y="94" width="42" height="28" rx="5" transform="rotate(-12 717 108)"/>
<rect x="773" y="141" width="42" height="28" rx="5" transform="rotate(25 794 155)"/><rect x="676" y="195" width="42" height="28" rx="5" transform="rotate(-20 697 209)"/>
<rect x="827" y="214" width="42" height="28" rx="5" transform="rotate(14 848 228)"/><rect x="755" y="238" width="42" height="28" rx="5" transform="rotate(-8 776 252)"/>
</g>
<g fill="none" stroke="#b99576" stroke-width="2" stroke-linecap="round"><path d="m632 173 8 29m73-61 7 39m73 12 5 26m-118 16-8 21m173 0 8 25"/></g>
<!-- Sieve and its support -->
<path d="M603 296 870 278 828 366 654 378Z" fill="#e0d3af" stroke="#355c49" stroke-width="5" stroke-linejoin="round"/>
<path d="m616 302 242-16-35 70-164 13Z" fill="url(#mesh)"/>
<path d="m824 365 98 34" stroke="#355c49" stroke-width="13" stroke-linecap="round"/>
<path d="m653 378-23 110m194-121 14 65" stroke="#55745a" stroke-width="6"/>
<circle cx="742" cy="410" r="13" fill="#d6e5a8" stroke="#40644f" stroke-width="3"/>
<path d="M743 429v28q0 18 20 18h96" fill="none" stroke="#c9dfa1" stroke-width="5" stroke-dasharray="8 9"/>
<!-- Desk and monitoring panel -->
<path d="M561 518h566l-20 22H577Z" fill="#b08e62" stroke="#725f43" stroke-width="3"/>
<path d="m588 540-12 90m502-90 16 90" stroke="#3b5847" stroke-width="13"/>
<rect x="884" y="363" width="228" height="143" rx="12" fill="#264f41" stroke="#173e33" stroke-width="4"/>
<rect x="898" y="377" width="200" height="110" rx="5" fill="#e8edda"/>
<path d="M909 451h39l13-23 14 34 17-57 16 46h77" fill="none" stroke="#4c8061" stroke-width="4" stroke-linejoin="round"/>
<circle cx="1080" cy="393" r="5" fill="#729650"/>
<path d="M998 507v10m-28 0h56" stroke="#264f41" stroke-width="7" stroke-linecap="round"/>
<!-- Ruby application -->
<path d="m669 466 22-25h44l24 25-45 42Z" fill="#a65d51" stroke="#76493f" stroke-width="3" stroke-linejoin="round"/>
<path d="m669 466 45-5 21-20m-44 0 23 20 45 5m-45-5v47" fill="none" stroke="#e1a086" stroke-width="2"/>
<ellipse cx="714" cy="517" rx="56" ry="6" fill="#4e6044" opacity=".2"/>
</g>
</svg>
